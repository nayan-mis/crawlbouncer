<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#FDFDFC">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0B0B0A">
<title>Join your team — CrawlBouncer</title>
<link rel="stylesheet" href="site.css">
</head>
<body>

<div class="auth-shell">
  <div class="auth-card">
    <a href="/" class="brand"><span class="brand-mark">C</span>CrawlBouncer</a>
    <h1 style="margin-top:22px" id="heading">Join your team</h1>
    <p class="lede" id="lede">Set a password to finish joining.</p>

    <form id="acceptForm">
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="new-password" required minlength="8" placeholder="••••••••">
      </div>
      <div class="field">
        <label for="confirm">Confirm password</label>
        <input type="password" id="confirm" autocomplete="new-password" required minlength="8" placeholder="••••••••">
      </div>
      <div class="form-error" id="formError"></div>
      <button type="submit" class="btn btn-primary btn-block" style="margin-top:22px" id="submitBtn">
        Set password &amp; join
      </button>
    </form>

    <div class="auth-switch" id="switchRow">Already have an account? <a href="/login.html">Log in</a></div>
  </div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const token = params.get("token");
const form = document.getElementById("acceptForm");
const errorBox = document.getElementById("formError");
const submitBtn = document.getElementById("submitBtn");

if (!token) {
  document.getElementById("heading").textContent = "Invalid link";
  document.getElementById("lede").textContent = "This invite link is missing its token. Ask whoever invited you to resend it.";
  form.style.display = "none";
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  errorBox.classList.remove("show");

  const password = document.getElementById("password").value;
  const confirm = document.getElementById("confirm").value;
  if (password !== confirm) {
    errorBox.textContent = "Passwords don't match.";
    errorBox.classList.add("show");
    return;
  }

  submitBtn.textContent = "Joining…";
  submitBtn.disabled = true;

  try {
    const resp = await fetch("/api/team/accept", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token, password }),
    });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.detail || "This invite link is invalid or has expired.");

    document.getElementById("heading").textContent = "You're in";
    document.getElementById("lede").textContent = "Your password is set — you can log in now.";
    form.style.display = "none";
    document.getElementById("switchRow").innerHTML = `<a href="/login.html" class="btn btn-primary btn-block">Log in</a>`;
  } catch (err) {
    errorBox.textContent = err.message;
    errorBox.classList.add("show");
    submitBtn.textContent = "Set password & join";
    submitBtn.disabled = false;
  }
});
</script>

</body>
</html>
