<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#FDFDFC">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0B0B0A">
<title>Sign up — CrawlBouncer</title>
<link rel="stylesheet" href="site.css">
</head>
<body>

<div class="auth-shell">
  <div class="auth-card">
    <a href="/" class="brand"><span class="brand-mark">C</span>CrawlBouncer</a>
    <h1 style="margin-top:22px">Create your account</h1>
    <p class="lede" id="signupLede">The first account on a new install becomes the admin.</p>

    <form id="signupForm">
      <div class="field">
        <label for="name">Name</label>
        <input type="text" id="name" autocomplete="name" placeholder="Your name">
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" autocomplete="email" required placeholder="you@yoursite.com">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="new-password" required minlength="8" placeholder="At least 8 characters">
      </div>
      <div class="form-error" id="formError"></div>
      <button type="submit" class="btn btn-primary btn-block" style="margin-top:22px" id="submitBtn">
        Create account
      </button>
    </form>

    <div id="checkEmailNotice" style="display:none; text-align:center">
      <p style="font-size:14px; color:var(--ink-1); margin-bottom:8px">Check your email</p>
      <p class="lede">We sent a verification link to confirm your account. Click it to continue — the link works for 24 hours.</p>
    </div>

    <div class="auth-switch" id="switchRow">Already have an account? <a href="/login.html">Log in</a></div>
  </div>
</div>

<script>
const form = document.getElementById("signupForm");
const errorBox = document.getElementById("formError");
const submitBtn = document.getElementById("submitBtn");

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  errorBox.classList.remove("show");
  submitBtn.textContent = "Creating account…";
  submitBtn.disabled = true;

  const body = {
    name: document.getElementById("name").value || null,
    email: document.getElementById("email").value,
    password: document.getElementById("password").value,
  };

  try {
    const resp = await fetch("/api/auth/register", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    const data = await resp.json();

    if (!resp.ok) {
      throw new Error(data.detail || "Something went wrong — try again.");
    }

    // The response is deliberately identical whether the email was new or
    // already registered, so this page can't be used to check which emails exist.
    form.style.display = "none";
    if (data.status === "registered") {
      // No email verification on this install (SMTP not configured): go log in.
      document.getElementById("signupLede").textContent = "Account created.";
      document.getElementById("switchRow").innerHTML = '<a href="/login.html">Log in now</a>';
    } else {
      document.getElementById("checkEmailNotice").style.display = "block";
    }
  } catch (err) {
    errorBox.textContent = err.message;
    errorBox.classList.add("show");
    submitBtn.textContent = "Create account";
    submitBtn.disabled = false;
  }
});
</script>

</body>
</html>
