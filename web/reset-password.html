<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset password — CrawlBouncer</title>
<link rel="stylesheet" href="/site.css">
</head>
<body>
<div class="auth-shell">
  <div class="auth-card">
    <a href="/" class="brand"><span class="brand-mark">C</span>CrawlBouncer</a>
    <h1 style="margin-top:22px" id="title">Reset your password</h1>
    <p class="lede" id="lede">Enter your email and we'll send you a reset link.</p>

    <form id="form">
      <div class="field" id="emailField">
        <label for="email">Email</label>
        <input type="email" id="email" autocomplete="email" required>
      </div>
      <div class="field" id="pwField" style="display:none">
        <label for="password">New password</label>
        <input type="password" id="password" autocomplete="new-password" minlength="8" placeholder="At least 8 characters">
      </div>
      <div class="form-error" id="formError"></div>
      <button type="submit" class="btn btn-primary btn-block" style="margin-top:22px" id="submitBtn">Send reset link</button>
    </form>
    <div class="auth-switch"><a href="/login.html">Back to log in</a></div>
  </div>
</div>

<script>
const token = new URLSearchParams(window.location.search).get("token");
const form = document.getElementById("form");
const errorBox = document.getElementById("formError");
const btn = document.getElementById("submitBtn");

if (token) {   // arrived from the email: choose a new password
  document.getElementById("title").textContent = "Choose a new password";
  document.getElementById("lede").textContent = "Pick something you haven't used elsewhere.";
  document.getElementById("emailField").style.display = "none";
  document.getElementById("email").required = false;
  document.getElementById("pwField").style.display = "block";
  document.getElementById("password").required = true;
  btn.textContent = "Set new password";
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  errorBox.classList.remove("show");
  btn.disabled = true;
  try {
    let resp;
    if (token) {
      resp = await fetch("/api/auth/password-reset/complete", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token, password: document.getElementById("password").value }),
      });
    } else {
      const email = encodeURIComponent(document.getElementById("email").value);
      resp = await fetch("/api/auth/password-reset/request?email=" + email, { method: "POST" });
    }
    const data = await resp.json().catch(() => ({}));
    if (!resp.ok) {
      const d = data.detail;
      throw new Error(typeof d === "string" ? d : "Something went wrong. Try again.");
    }
    form.style.display = "none";
    document.getElementById("lede").textContent = token
      ? "Password changed. You can log in now."
      : "If that email has an account, a reset link is on its way. (No email set up on this server? The link is printed in the server log.)";
  } catch (err) {
    errorBox.textContent = err.message;
    errorBox.classList.add("show");
    btn.disabled = false;
  }
});
</script>
</body>
</html>
