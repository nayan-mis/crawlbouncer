name: Bug report
description: Something is broken or behaves unexpectedly
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what actually happened?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Output of `docker compose logs crawlbouncer` (remove anything private).
      render: shell
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: "e.g. v0.1.0 or a commit hash"
  - type: dropdown
    id: how
    attributes:
      label: How are you running it?
      options: [Docker, "Python directly", Other]
